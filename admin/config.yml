backend:
  name: turbo-github
  turbo_site_id: af96e28e-6d68-4a34-8833-78a0c59753b9
  branch: main

media_folder: "images/products"
public_folder: "/images/products"

collections:
  - name: "products"
    label: "Products"
    files:
      - name: "product_list"
        label: "All Products"
        file: "products.json"
        format: "json"
        fields:
          - label: "Products"
            name: "products"
            widget: "list"
            summary: "{{fields.name}} - Rs. {{fields.price}}"
            fields:
              - { label: "Product Name", name: "name", widget: "string" }
              - { label: "Price (PKR)", name: "price", widget: "number", value_type: "int" }
              - { label: "Product Image", name: "image", widget: "image" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Category", name: "category", widget: "string", required: false }
              - { label: "Sizes / Colors", name: "options", widget: "string", required: false }
              - { label: "Available", name: "available", widget: "boolean", default: true }
