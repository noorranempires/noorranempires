<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Place Order | NOORRANEMPIRES</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #faf7ff;
      color: #2d2140;
    }
    .container {
      max-width: 650px;
      margin: 50px auto;
      padding: 30px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }
    h1 { color: #6b35b5; text-align: center; }
    .details {
      text-align: left;
      background: #faf7ff;
      padding: 18px;
      border-radius: 10px;
      overflow-wrap: anywhere;
      margin-top: 15px;
    }
    a, button {
      display: inline-block;
      margin-top: 18px;
      padding: 13px 22px;
      border: 0;
      border-radius: 25px;
      background: #6b35b5;
      color: white;
      text-decoration: none;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .note { text-align: center; color: #8a5b00; }
    #status { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Review Your Order</h1>
    <p>Please check your delivery details before placing your order.</p>

    <div class="details" id="customerDetails"></div>
    <div class="details" id="orderDetails"></div>

    <p class="note" id="status">Your order has not been sent yet.</p>

    <button id="confirmOrder">Confirm Order</button>
    <br>
    <a href="checkout.html">Edit Details</a>
    <br>
    <a href="index.html">Continue Shopping</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script>
    emailjs.init({ publicKey: "04qmoyUpCgraNG5-z" });

    const customer = JSON.parse(
      sessionStorage.getItem("noorranCustomer") || "null"
    );
    const cart = JSON.parse(
      localStorage.getItem("noorranCart") || "[]"
    );

    const customerBox = document.getElementById("customerDetails");
    const orderBox = document.getElementById("orderDetails");
    const confirmButton = document.getElementById("confirmOrder");
    const statusBox = document.getElementById("status");

    function addDetail(parent, label, value) {
      const p = document.createElement("p");
      const strong = document.createElement("strong");
      strong.textContent = label + ": ";
      p.appendChild(strong);
      p.appendChild(document.createTextNode(value || "Not provided"));
      parent.appendChild(p);
    }

    let total = 0;
    let orderDetails = "";

    if (!customer || cart.length === 0) {
      customerBox.textContent =
        "Checkout details are missing. Please return to your cart and try again.";
      confirmButton.disabled = true;
    } else {
      addDetail(customerBox, "Name", customer.name);
      addDetail(customerBox, "Mobile", customer.phone);
      addDetail(customerBox, "Email", customer.email);
      addDetail(customerBox, "Address", customer.address);
      addDetail(customerBox, "City", customer.city);

      const lines = [];

      cart.forEach(item => {
        const price = Number(item.price);
        const quantity = Number(item.quantity);
        const subtotal = price * quantity;
        total += subtotal;

        lines.push(
          `${item.name} x ${quantity} = Rs. ${subtotal.toLocaleString()}`
        );

        const p = document.createElement("p");
        p.textContent =
          `${item.name} x ${quantity} — Rs. ${subtotal.toLocaleString()}`;
        orderBox.appendChild(p);
      });

      orderDetails = lines.join("\n");
      addDetail(orderBox, "Total", "Rs. " + total.toLocaleString());
    }

    confirmButton.addEventListener("click", async () => {
      if (!customer || cart.length === 0) {
        statusBox.textContent = "Your order details are missing.";
        return;
      }

      confirmButton.disabled = true;
      confirmButton.textContent = "Sending Order...";
      statusBox.textContent = "Sending your order by email...";

      try {
        await emailjs.send(
          "service_1b9ex9i",
          "template_x5kq4tu",
          {
            customer_name: customer.name,
            customer_phone: customer.phone,
            customer_email: customer.email || "Not provided",
            customer_address: customer.address,
            customer_city: customer.city,
            order_details: orderDetails,
            order_total: total.toLocaleString()
          }
        );

        statusBox.textContent =
          "Order email sent successfully! Thank you for shopping with us.";
        confirmButton.textContent = "Order Sent";
      } catch (error) {
        console.error("EmailJS error:", error);
        statusBox.textContent =
          "Email could not be sent. Please try again later.";
        confirmButton.disabled = false;
        confirmButton.textContent = "Retry Confirm Order";
      }
    });
  </script>
</body>
</html>
