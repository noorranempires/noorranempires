<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | NOORRANEMPIRES</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #faf7ff;
      color: #2d2140;
    }

    header {
      background: linear-gradient(90deg, #6b35b5, #b8860b);
      padding: 18px;
      border-radius: 12px;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    header img { width: 130px; max-width: 45%; }
    header a { color: white; text-decoration: none; font-weight: bold; }

    .container {
      max-width: 700px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    h1, h2 { color: #6b35b5; }
    label { display: block; margin: 16px 0 7px; font-weight: bold; }

    input, textarea, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #d8cce8;
      border-radius: 8px;
      font-size: 16px;
      font-family: inherit;
    }

    textarea { min-height: 90px; resize: vertical; }

    .summary {
      background: #faf7ff;
      border-radius: 10px;
      padding: 16px;
      margin-top: 22px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 15px;
      border: 0;
      border-radius: 30px;
      background: #6b35b5;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .back { color: #6b35b5; }
  </style>
</head>
<body>

<header>
  <img src="logo.png.png" alt="NOORRANEMPIRES Logo">
  <a href="card.html">← Back to Cart</a>
</header>

<div class="container">
  <h1>Checkout</h1>
  <p>Enter your delivery details below.</p>

  <form id="checkoutForm">
    <label for="name">Full Name *</label>
    <input id="name" name="name" autocomplete="name" required>

    <label for="phone">Mobile Number *</label>
    <input id="phone" name="phone" type="tel"
      autocomplete="tel" placeholder="03XXXXXXXXX" required>

    <label for="email">Email (Optional)</label>
    <input id="email" name="email" type="email" autocomplete="email">

    <label for="address">Complete Delivery Address *</label>
    <textarea id="address" name="address"
      autocomplete="street-address" required></textarea>

    <label for="city">City *</label>
    <input id="city" name="city" autocomplete="address-level2" required>

    <div class="summary">
      <h2>Order Summary</h2>
      <div id="orderSummary">Loading cart...</div>
    </div>

    <button type="submit">Continue to Place Order</button>
  </form>
</div>

<script>
  const cart = JSON.parse(localStorage.getItem("noorranCart")) || [];
  const summary = document.getElementById("orderSummary");

  if (cart.length === 0) {
    summary.textContent = "Your cart is empty. Please add products first.";
    document.querySelector('button[type="submit"]').disabled = true;
  } else {
    const total = cart.reduce((sum, item) =>
      sum + Number(item.price) * Number(item.quantity), 0);

    summary.innerHTML = cart.map(item =>
      `<p>${item.name} × ${item.quantity} — Rs. ${
        (Number(item.price) * Number(item.quantity)).toLocaleString()
      }</p>`
    ).join("") + `<hr><h3>Total: Rs. ${total.toLocaleString()}</h3>`;
  }

  document.getElementById("checkoutForm").addEventListener("submit", function(event) {
    event.preventDefault();

    if (cart.length === 0) {
      alert("Your cart is empty.");
      return;
    }

    const customer = {
      name: document.getElementById("name").value.trim(),
      phone: document.getElementById("phone").value.trim(),
      email: document.getElementById("email").value.trim(),
      address: document.getElementById("address").value.trim(),
      city: document.getElementById("city").value.trim()
    };

    if (!customer.name || !customer.phone ||
        !customer.address || !customer.city) {
      alert("Please fill in all required fields.");
      return;
    }

    sessionStorage.setItem("noorranCustomer", JSON.stringify(customer));
    window.location.href = "place-order.html";
  });
</script>

</body>
</html>
